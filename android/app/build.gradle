plugins { id 'com.android.application' }
android {
  namespace 'de.stepbyzdeb.uebermacht'
  compileSdk 34
  defaultConfig {
    applicationId 'de.stepbyzdeb.uebermacht'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }
  androidResources { noCompress 'html' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false }
}
