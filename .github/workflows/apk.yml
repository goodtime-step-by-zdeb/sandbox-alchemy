name: APK bauen
on:
  push:
    branches: [apk-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bauen
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Ergebnis ablegen
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          cp android/app/build/outputs/apk/debug/*.apk /tmp/out/Uebermacht.apk || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git checkout -B gh-pages FETCH_HEAD
          mkdir -p uebermacht
          cp /tmp/out/build.log uebermacht/build.log || true
          if [ -f /tmp/out/Uebermacht.apk ]; then cp /tmp/out/Uebermacht.apk uebermacht/Uebermacht.apk; fi
          git add uebermacht
          git commit -m "APK-Build ${{ github.run_number }}" || true
          git push origin gh-pages
