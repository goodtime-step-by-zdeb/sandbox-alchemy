<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0b1030">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Übermacht</title>
<style>
  /* Schriften: Lilita One (Überschriften, Zahlen, Knöpfe) und Nunito (Text) werden per Skript nachgeladen; ohne Netz greift die Systemschrift in fett */
  :root{--fh:"Lilita One","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fb:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hw:900;
    --bg:#141a3a;--pan:#1f2858;--rim:#3d4ea8;--sub:#aab4e8;--gold:#ffc928;--ok:#3ddc84;--bad:#ff3d4d;--ink:#0b1030;
    --ol:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 2px var(--ink),-1.5px -1.5px var(--ink),1.5px -1.5px var(--ink),-1.5px 1.5px var(--ink),1.5px 1.5px var(--ink)}
  html.fok{--hw:400}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--fb);font-weight:800;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button,input{font-family:inherit;font-weight:inherit}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #gl{z-index:0;transition:transform .45s cubic-bezier(.3,.9,.3,1)}#c{z-index:1;pointer-events:auto}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 45%,rgba(0,0,12,.55) 100%)}
  /* Im Menü rückt die 3D-Ansicht nach oben, damit die Truppe im freien Feld über den Tafeln steht */
  body[data-st=menu] #gl{transform:translateY(var(--gy,-150px))}
  body[data-st=over] #mute,body[data-st=over] #muteIc,body[data-st=perk] #mute,body[data-st=perk] #muteIc{display:none}
  body[data-st=menu] #c,body[data-st=menu] #vig{visibility:hidden}
  .hide{display:none!important}
  .ico{display:inline-block;vertical-align:-.22em;flex:none;overflow:visible}
  .fh{font-family:var(--fh);font-weight:var(--hw);letter-spacing:.02em}
  /* ---------- Überlagerungen als Tafeln ---------- */
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;box-sizing:border-box;background:radial-gradient(ellipse at center,rgba(12,16,48,.55),rgba(6,8,26,.86));touch-action:none;z-index:10;animation:ovin .25s ease-out}
  @keyframes ovin{from{opacity:0}to{opacity:1}}
  .pan{width:min(92vw,400px);box-sizing:border-box;background:linear-gradient(180deg,#2a3684,#1a2150 60%);border:3px solid #5567d6;border-radius:24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 0 #0a0e2c,0 22px 44px rgba(0,0,0,.6);padding:0 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pin .42s cubic-bezier(.2,1.5,.4,1) both;max-height:calc(100vh - 28px)}
  @keyframes pin{0%{opacity:0;transform:translateY(40px) scale(.82)}100%{opacity:1;transform:none}}
  .pan .hd{align-self:stretch;margin:-3px -17px 2px;padding:12px 10px 11px;border-radius:24px 24px 14px 14px;background:linear-gradient(180deg,#4f8dff,#1e55d8);border:3px solid #9cc4ff;border-bottom-width:5px;border-bottom-color:#12349a;box-shadow:inset 0 2px 0 rgba(255,255,255,.4);position:relative;overflow:hidden}
  .pan .hd::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:42%;border-radius:16px;background:rgba(255,255,255,.16)}
  .pan .hd.gold{background:linear-gradient(180deg,#ffd23f,#ff8f1a);border-color:#fff1b0;border-bottom-color:#a3440a}
  .pan .hd.red{background:linear-gradient(180deg,#ff6a5a,#c81f33);border-color:#ffb3a8;border-bottom-color:#7a0f1f}
  h1,h2,h3{font-family:var(--fh);font-weight:var(--hw);margin:0}
  h2{font-size:clamp(26px,7.6vw,34px);letter-spacing:.03em;color:#fff;text-shadow:var(--ol),0 4px 0 var(--ink);position:relative;z-index:1;line-height:1.05}
  p{margin:0;font-size:15px;line-height:1.4;color:var(--sub)}
  /* ---------- Knöpfe ---------- */
  .big,.sec{position:relative;overflow:hidden;border:0;cursor:pointer;color:#fff;font-family:var(--fh);font-weight:var(--hw);letter-spacing:.04em;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box}
  .big{font-size:27px;min-height:64px;padding:0 30px;min-width:230px;background:linear-gradient(180deg,#ffd257,#ffb21e 48%,#ff7a1a);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(160,60,0,.25),0 5px 0 #a3440a,0 12px 22px rgba(0,0,0,.45);text-shadow:0 2px 0 #a3440a,0 0 1px #a3440a}
  .big::before,.sec::before{content:"";position:absolute;left:6px;right:6px;top:4px;height:40%;border-radius:14px 14px 30px 30px;background:rgba(255,255,255,.2);pointer-events:none}
  .big::after{content:"";position:absolute;top:-20%;bottom:-20%;width:34px;left:-60px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:skewX(-20deg);animation:shine 2.6s infinite;pointer-events:none}
  @keyframes shine{0%,55%{left:-60px}100%{left:calc(100% + 40px)}}
  .big:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 1px 0 #a3440a}
  .big.g{background:linear-gradient(180deg,#7bf0aa,#3ddc84 48%,#1fae62);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 5px 0 #0f7340,0 12px 22px rgba(0,0,0,.45);text-shadow:0 2px 0 #0f7340}
  .big.g:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 1px 0 #0f7340}
  .big.p{background:linear-gradient(180deg,#8fe6ff,#4fd1ff 48%,#1e8fe0);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 5px 0 #0e4f8c,0 12px 22px rgba(0,0,0,.45);text-shadow:0 2px 0 #0e4f8c}
  .big[disabled]{filter:grayscale(.85) brightness(.75)}.big[disabled]::after{display:none}
  .big.hero{min-height:76px;font-size:36px;width:100%;animation:breath 1.6s ease-in-out infinite alternate}
  /* „Atmen" nur über Helligkeit und Schein – der Knopf bleibt ortsfest (wichtig für automatische Klick-Tests) */
  @keyframes breath{from{filter:brightness(1)}to{filter:brightness(1.12) drop-shadow(0 0 9px rgba(255,225,130,.85))}}
  .big.hero:active{animation:none}
  .sec{font-size:17px;min-height:46px;padding:0 20px;background:linear-gradient(180deg,#3a4bb0,#27338a);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 #101642;text-shadow:0 2px 0 #101642}
  .sec:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 1px 0 #101642}
  .mini{position:relative;border:0;cursor:pointer;font-family:var(--fh);font-weight:var(--hw);font-size:15px;letter-spacing:.02em;color:#5a2a00;background:linear-gradient(180deg,#ffe07a,#ffc928 50%,#ff9d1a);border-radius:12px;padding:0 11px;min-height:44px;min-width:64px;white-space:nowrap;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #a3540a;display:inline-flex;align-items:center;justify-content:center;gap:4px}
  .mini:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 #a3540a}
  .mini.g{background:linear-gradient(180deg,#8df5b6,#3ddc84 50%,#1fae62);color:#053b1e;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #0f7340}
  .mini.b{background:linear-gradient(180deg,#7fb2ff,#3b82f6 50%,#1c55d0);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #12349a;text-shadow:0 1px 0 #12349a}
  .mini[disabled],.mini.g[disabled],.mini.b[disabled]{background:linear-gradient(180deg,#46508a,#343c70);color:#aab4e8;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 #171d48;text-shadow:none}
  .mini.on{background:linear-gradient(180deg,#27336f,#1a2250);color:#7bf0aa;box-shadow:inset 0 0 0 2px #3ddc84}
  /* ---------- Karten und Plaketten ---------- */
  .ib{flex:none;width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#5b7cff,#2c47c8);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.22),0 3px 0 #0c1130;position:relative}
  .ib.gold{background:linear-gradient(180deg,#ffd257,#ff8f1a)}.ib.grn{background:linear-gradient(180deg,#7bf0aa,#1fae62)}.ib.red{background:linear-gradient(180deg,#ff7a6a,#c81f33)}.ib.vio{background:linear-gradient(180deg,#c08cff,#6a35d8)}.ib.cy{background:linear-gradient(180deg,#8fe6ff,#1e8fe0)}.ib.dk{background:linear-gradient(180deg,#3a4480,#252c5c)}
  .card{color:#fff;text-align:left;background:linear-gradient(180deg,#2a3684,#1c2458);border:2px solid #4a5cc8;border-radius:16px;padding:10px 11px;display:flex;gap:11px;align-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 4px 0 #0c1130;box-sizing:border-box;position:relative}
  .card .tx{flex:1;min-width:0}
  .card b,.wp b{display:block;font-family:var(--fh);font-weight:var(--hw);font-size:17.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .card span,.wp span{font-size:13px;color:var(--sub);display:block;line-height:1.3}
  .card.wr b{white-space:normal;font-size:16px;line-height:1.15}
  .card.lock{background:linear-gradient(180deg,#232a5c,#181e48);border-color:#333d80}
  .card.sel,.wp.sel{border-color:#ffd23f;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 0 0 2px rgba(255,210,63,.35),0 4px 0 #0c1130}
  .lvb{position:absolute;right:-5px;bottom:-5px;min-width:20px;height:20px;padding:0 4px;box-sizing:border-box;border-radius:10px;background:#0b1030;border:2px solid #ffd23f;color:#ffd23f;font-family:var(--fh);font-weight:var(--hw);font-size:12px;line-height:16px;text-align:center}
  .pb{height:10px;border-radius:5px;background:#0e1338;box-shadow:inset 0 2px 0 rgba(0,0,0,.4);overflow:hidden;margin-top:5px}
  .pb i{display:block;height:100%;border-radius:5px;background:linear-gradient(180deg,#8df5b6,#1fae62);box-shadow:inset 0 2px 0 rgba(255,255,255,.4);transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .pb.gold i{background:linear-gradient(180deg,#ffe07a,#ff9d1a)}.pb.cy i{background:linear-gradient(180deg,#8fe6ff,#1e8fe0)}
  .col{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}.row.nw{flex-wrap:nowrap;gap:6px}
  /* ---------- Hauptmenü ---------- */
  #menu{justify-content:flex-start;padding:0;background:linear-gradient(180deg,rgba(11,16,48,.8) 0,rgba(11,16,48,.25) 70px,rgba(11,16,48,0) 150px);animation:none;touch-action:pan-y}
  #mtop{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:8px 52px 0 8px;padding-top:max(8px,env(safe-area-inset-top))}
  #rank{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#27327a,#1a2150);border:2px solid #4a5cc8;border-radius:14px;padding:4px 9px 5px 5px;box-shadow:0 3px 0 #0c1130;text-align:left}
  #rank .rb{flex:none;width:30px;height:30px;border-radius:9px;background:linear-gradient(180deg,#ffd257,#ff8f1a);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
  #rank .rt{flex:1;min-width:0}
  #rank .rn{font-family:var(--fh);font-weight:var(--hw);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  #rank .pb{height:7px;margin-top:2px}
  #cur{display:flex;gap:6px;flex:none}
  #cur span{display:flex;align-items:center;gap:4px;font-family:var(--fh);font-weight:var(--hw);font-size:16px;background:linear-gradient(180deg,#141a40,#0b1030);border:2px solid #3d4ea8;border-radius:999px;padding:3px 10px 3px 4px;box-shadow:0 3px 0 #070a22;min-height:26px}
  #mhead{width:100%;padding:8px 0 0;pointer-events:none}
  h1{position:relative;display:inline-block;max-width:100vw;white-space:nowrap;font-size:clamp(38px,12vw,56px);letter-spacing:.02em;line-height:1;color:var(--ink);-webkit-text-stroke:11px var(--ink);filter:drop-shadow(0 5px 0 #070a22) drop-shadow(0 10px 14px rgba(0,0,0,.5));transform:rotate(-2.5deg)}
  h1::before{content:attr(data-t);position:absolute;left:0;top:0;-webkit-text-stroke:4px #fff;color:#fff}
  h1::after{content:attr(data-t);position:absolute;left:0;top:0;-webkit-text-stroke:0;background:linear-gradient(180deg,#fff7c0 18%,#ffd23f 48%,#ff7a1a 86%);-webkit-background-clip:text;background-clip:text;color:transparent}
  #hero{flex:1;min-height:90px;width:100%;position:relative;pointer-events:none}
  body[data-tab=sub] #mhead{display:none}
  body[data-tab=sub] #hero{flex:none;height:27vh;min-height:0}
  #hname{position:absolute;left:0;right:0;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:3px}
  #hname b{font-family:var(--fh);font-weight:var(--hw);font-size:19px;letter-spacing:.04em;background:linear-gradient(180deg,#27327a,#1a2150);border:2px solid #5567d6;border-radius:999px;padding:2px 16px 3px;box-shadow:0 3px 0 #0c1130;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hname i{font-style:normal;font-size:13px;color:#fff;text-shadow:var(--ol)}
  #gift{position:absolute;right:10px;top:16px;pointer-events:auto;border:0;cursor:pointer;width:66px;padding:6px 0 4px;border-radius:16px;background:linear-gradient(180deg,#7bf0aa,#1fae62);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #0f7340,0 8px 14px rgba(0,0,0,.4);color:#fff;font-family:var(--fh);font-weight:var(--hw);font-size:12px;line-height:1.1;text-shadow:0 1px 0 #0f7340;animation:wob 1.4s ease-in-out infinite}
  @keyframes wob{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg) scale(1.06)}80%{transform:rotate(7deg) scale(1.06)}90%{transform:rotate(-4deg)}}
  .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#ff3d4d;border:2px solid #fff;box-sizing:border-box;font-family:var(--fh);font-weight:var(--hw);font-style:normal;font-size:11px;line-height:14px;color:#fff;text-align:center;padding:0 3px}
  #tabc{width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:9px;padding:10px 12px 12px;text-align:left;flex:none;background:linear-gradient(180deg,rgba(20,26,58,0),rgba(20,26,58,.92) 26px,#141a3a 60px)}
  body[data-tab=sub] #tabc{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:linear-gradient(180deg,#232c68,#141a3a 120px);border-top:3px solid #5567d6;border-radius:24px 24px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.4);padding-top:12px}
  #tabc>*{flex:none}
  #tabc h3{margin:6px 2px -2px;font-size:16px;letter-spacing:.05em;color:#ffd23f;text-shadow:0 2px 0 var(--ink)}
  #tabc p{font-size:13.5px;text-align:center}
  #tabc .card,.wp{width:100%}
  .goal{display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#27327a,#1a2150);border:2px solid #4a5cc8;border-radius:14px;padding:6px 10px 7px 6px;box-shadow:0 3px 0 #0c1130;cursor:pointer;color:#fff;text-align:left;font-size:13.5px;width:100%;box-sizing:border-box}
  .goal .ib{width:36px;height:36px;border-radius:10px}.goal .tx{flex:1;min-width:0}.goal em{font-style:normal;color:#ffd23f}
  .goal.rdy{border-color:#3ddc84;animation:glow 1s infinite alternate}
  @keyframes glow{from{box-shadow:0 3px 0 #0c1130,0 0 0 rgba(61,220,132,0)}to{box-shadow:0 3px 0 #0c1130,0 0 14px rgba(61,220,132,.8)}}
  #modes{display:flex;gap:0;width:100%;background:#0b1030;border:2px solid #3d4ea8;border-radius:16px;padding:3px;box-sizing:border-box;box-shadow:inset 0 3px 0 rgba(0,0,0,.4)}
  #modes button{flex:1;border:0;background:none;color:#8f9ad8;font-family:var(--fh);font-weight:var(--hw);font-size:17px;letter-spacing:.03em;border-radius:12px;padding:6px 2px 5px;cursor:pointer;line-height:1.1}
  #modes button small{display:block;font-family:var(--fb);font-weight:800;font-size:11px;letter-spacing:0;opacity:.85;margin-top:1px}
  #modes button.sel{color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.45);text-shadow:0 2px 0 rgba(0,0,0,.35)}
  #modes button.sel.m0{background:linear-gradient(180deg,#7bf0aa,#1fae62)}#modes button.sel.m1{background:linear-gradient(180deg,#ffd257,#ff8f1a)}#modes button.sel.m2{background:linear-gradient(180deg,#ff7a6a,#c81f33)}
  .ctr{display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:2px}
  .rrow{display:flex;gap:9px;width:100%;align-items:stretch}
  .rrow .big{flex:1;min-width:0;padding:0 8px;font-size:30px;line-height:1}
  .big small{display:block;font-family:var(--fb);font-weight:800;font-size:12px;letter-spacing:0;text-shadow:none;color:#063d20;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .sec{flex:none;width:86px;min-height:76px;font-size:15px;line-height:1.1;padding:0 4px}
  /* Leiste unten */
  #tabs{width:100%;flex:none;display:flex;background:linear-gradient(180deg,#232c68,#141a3a);border-top:3px solid #5567d6;padding:0 4px;padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box;position:relative;z-index:2}
  #tabs button{flex:1;border:0;background:none;color:#8f9ad8;font-family:var(--fh);font-weight:var(--hw);font-size:12.5px;letter-spacing:.02em;padding:7px 0 7px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px;justify-content:flex-end}
  #tabs button .ico{opacity:.6;transition:transform .2s}
  #tabs button.sel{color:#fff}
  #tabs button.sel .ico{opacity:1;transform:translateY(-7px) scale(1.28)}
  #tabs button.sel::before{content:"";position:absolute;left:8%;right:8%;top:-9px;bottom:5px;border-radius:14px;background:linear-gradient(180deg,#4f8dff,#1e55d8);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #12349a;z-index:-1}
  #tabs button .dot{top:1px;right:14%}
  /* Waffen */
  .wp{background:linear-gradient(180deg,#2a3684,#1c2458);border:2px solid #4a5cc8;border-radius:16px;padding:10px 11px;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 4px 0 #0c1130;box-sizing:border-box}
  .wp.lock{background:linear-gradient(180deg,#232a5c,#181e48);border-color:#333d80}
  .wp .top{display:flex;align-items:center;gap:11px}.wp .top .tx{flex:1;min-width:0}
  .wp .ups{display:flex;gap:6px;margin-top:9px}
  .wp .ups button{flex:1;min-width:0;border:0;color:#fff;background:linear-gradient(180deg,#3a4bb0,#27338a);border-radius:12px;padding:5px 2px 6px;font-size:12px;cursor:pointer;line-height:1.25;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 3px 0 #101642;display:flex;flex-direction:column;align-items:center}
  .wp .ups button:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 1px 0 #101642}
  .wp .ups button[disabled]{background:linear-gradient(180deg,#2a3270,#1f2658);color:#8f9ad8}
  .wp .ups button u{text-decoration:none;font-family:var(--fh);font-weight:var(--hw);font-size:13px;display:flex;align-items:center;gap:3px}
  .wp .ups button em{font-style:normal;font-family:var(--fh);font-weight:var(--hw);font-size:13.5px;color:#ffd23f;display:flex;align-items:center;gap:3px}
  .act{font-family:var(--fh);font-weight:var(--hw);font-size:14px;color:#7bf0aa;display:flex;align-items:center;gap:3px;white-space:nowrap}
  /* Truppe */
  .sw{flex:1;max-width:46px;min-width:0;aspect-ratio:1;height:auto;border-radius:14px;border:3px solid rgba(255,255,255,.35);cursor:pointer;position:relative;font-family:var(--fh);font-weight:var(--hw);font-size:12px;color:#fff;display:flex;align-items:center;justify-content:center;gap:1px;text-shadow:0 1px 2px #000;padding:0;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25),0 3px 0 #0c1130}

  var raw=(ts-last)/1000||0,dt=Math.min(0.034,raw);last=ts;frameVoices=0;

  time+=dt;

  if(curKey!==ftKey){ftKey=curKey;ftHold=0.8;ftAcc=0;ftN=0;ftSlow=0;}

      ftAcc=0;ftN=0;ftSlow=0;}}}

  requestAnimationFrame(frame);
}
