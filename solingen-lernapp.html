<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solingen Klingenschmiede ⚔️ Lernspiel</title>
<style>
  :root{
    --blau:#1f63b8;--blau-dunkel:#15407a;--nacht:#0e2238;
    --gold:#f5b212;--gold-hell:#ffd65a;--feuer:#ff7a18;--glut:#ff4d2e;
    --gruen:#3fae5a;--rot:#e1564b;--bg:#0c1a2b;--karte:#16273d;
    --karte2:#1d3450;--text:#eaf2fb;--grau:#8ba0b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background:radial-gradient(circle at 50% -10%, #1c3656 0%, #0c1a2b 60%);
    color:var(--text);line-height:1.45;overflow-x:hidden;min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 90px;position:relative;z-index:2;}

  /* ---------- Glut-Hintergrund ---------- */
  .embers{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .ember{position:absolute;bottom:-20px;width:6px;height:6px;border-radius:50%;
    background:var(--feuer);filter:blur(1px);opacity:.6;animation:rise linear infinite;}
  @keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:0;}}

  /* ---------- HUD ---------- */
  .hud{position:sticky;top:0;z-index:10;
    background:linear-gradient(135deg,var(--blau-dunkel),var(--nacht));
    border:2px solid #2c4a6e;border-radius:0 0 20px 20px;padding:10px 14px;
    box-shadow:0 6px 20px rgba(0,0,0,.5);margin-bottom:8px;}
  .hud-top{display:flex;align-items:center;gap:10px;}
  .avatar{font-size:2rem;filter:drop-shadow(0 0 6px var(--gold));line-height:1;
    transition:transform .3s;}
  .avatar.hop{animation:hop .5s;}
  @keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) scale(1.15)}}
  .rang-info{flex:1;min-width:0;}
  .rang-name{font-weight:bold;font-size:1rem;color:var(--gold-hell);}
  .rang-sub{font-size:.7rem;color:var(--grau);}
  .taler{display:flex;align-items:center;gap:4px;font-weight:bold;color:var(--gold-hell);
    background:rgba(245,178,18,.14);padding:5px 10px;border-radius:20px;font-size:.95rem;white-space:nowrap;}
  .xp-leiste{margin-top:8px;height:14px;background:#0a1726;border-radius:10px;overflow:hidden;
    border:1px solid #2c4a6e;position:relative;}
  .xp-fuell{height:100%;width:0;border-radius:10px;
    background:linear-gradient(90deg,var(--feuer),var(--gold));transition:width .6s ease;
    box-shadow:0 0 10px var(--feuer);}
  .xp-text{position:absolute;inset:0;text-align:center;font-size:.68rem;font-weight:bold;
    color:#fff;text-shadow:0 1px 2px #000;line-height:14px;}
  .ton-knopf{background:none;border:none;font-size:1.2rem;cursor:pointer;padding:2px;}

  h1.titel{text-align:center;font-size:1.3rem;margin:10px 0 2px;color:var(--gold-hell);
    text-shadow:0 0 12px rgba(245,178,18,.4);}
  .titel-sub{text-align:center;font-size:.85rem;color:var(--grau);margin-bottom:6px;}

  h2{font-size:1.2rem;margin:14px 2px 10px;color:var(--gold-hell);}
  .zurueck{display:inline-flex;align-items:center;gap:6px;border:none;
    background:var(--karte);color:var(--gold-hell);font-weight:bold;cursor:pointer;
    padding:9px 16px;border-radius:30px;font-size:.95rem;margin:12px 0 4px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);font-family:inherit;border:1px solid #2c4a6e;}
  .zurueck:active{transform:scale(.96);}

  /* ---------- Startbildschirm ---------- */
  .held-karte{background:linear-gradient(150deg,var(--karte),#0f2138);
    border:2px solid #2c4a6e;border-radius:22px;padding:18px;text-align:center;
    box-shadow:0 6px 22px rgba(0,0,0,.45);margin-top:6px;position:relative;overflow:hidden;}
  .held-karte .gross-avatar{font-size:4rem;filter:drop-shadow(0 0 14px var(--gold));}
  .held-karte .naechster{font-size:.82rem;color:var(--grau);margin-top:4px;}
  .spielen-knopf{background:linear-gradient(90deg,var(--feuer),var(--gold));
    color:#3a2200;border:none;border-radius:30px;width:100%;padding:18px;
    font-size:1.25rem;font-weight:bold;cursor:pointer;font-family:inherit;margin-top:14px;
    box-shadow:0 4px 16px rgba(255,122,24,.5);animation:pulseBtn 1.8s infinite;}
  @keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .spielen-knopf:active{transform:scale(.97);}

  .tages-banner{background:linear-gradient(90deg,#2a1c00,#3d2a00);border:2px solid var(--gold);
    border-radius:18px;padding:14px;margin-top:12px;display:flex;align-items:center;gap:12px;
    cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);}
  .tages-banner.fertig{opacity:.6;border-color:#2c4a6e;}
  .tages-banner .emo{font-size:2rem;}
  .tages-banner b{color:var(--gold-hell);}
  .tages-banner span{font-size:.8rem;color:var(--grau);display:block;}

  .gitter{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px;}
  .kachel{background:var(--karte);border:1px solid #2c4a6e;border-radius:18px;padding:14px 10px;
    text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35);
    font-family:inherit;color:var(--text);transition:transform .12s;
    display:flex;flex-direction:column;align-items:center;gap:5px;min-height:108px;justify-content:center;
    border-top:4px solid var(--gold);}
  .kachel:active{transform:translateY(2px) scale(.98);}
  .kachel .emo{font-size:2rem;line-height:1;}
  .kachel .titel{font-weight:bold;font-size:.95rem;}
  .kachel .mini{font-size:.72rem;color:var(--grau);}

  .modus-reihe{display:flex;flex-direction:column;gap:11px;margin-top:8px;}
  .modus-knopf{background:var(--karte);border:1px solid #2c4a6e;border-radius:16px;padding:14px;
    display:flex;align-items:center;gap:13px;cursor:pointer;font-family:inherit;
    box-shadow:0 4px 12px rgba(0,0,0,.35);text-align:left;color:var(--text);border-left:5px solid var(--feuer);}
  .modus-knopf:active{transform:scale(.99);}
  .modus-knopf .emo{font-size:1.9rem;}
  .modus-knopf .txt b{font-size:1.04rem;color:var(--gold-hell);}
  .modus-knopf .txt span{font-size:.8rem;color:var(--grau);display:block;}

  /* ---------- Karteikarten ---------- */
  .karte-flip{perspective:1200px;margin:16px 0;height:330px;cursor:pointer;}
  .karte-innen{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;}
  .karte-flip.gedreht .karte-innen{transform:rotateY(180deg);}
  .karte-seite{position:absolute;width:100%;height:100%;backface-visibility:hidden;
    border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.5);border:2px solid #2c4a6e;}
  .karte-vorne{background:linear-gradient(150deg,var(--blau),var(--blau-dunkel));color:#fff;}
  .karte-hinten{background:linear-gradient(150deg,var(--gold-hell),var(--gold));color:#3a2a00;transform:rotateY(180deg);}
  .karte-seite .frage{font-size:1.28rem;font-weight:bold;}
  .karte-seite .antwort{font-size:1.1rem;}
  .karte-seite .label{font-size:.76rem;text-transform:uppercase;letter-spacing:1px;opacity:.8;margin-bottom:10px;}
  .karte-seite .tipp{font-size:.84rem;margin-top:14px;opacity:.9;}
  .karten-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .nav-knopf{background:var(--blau);color:#fff;border:none;border-radius:30px;padding:12px 20px;
    font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 3px 8px rgba(0,0,0,.4);}
  .nav-knopf:disabled{background:#33455a;box-shadow:none;color:#7d8a99;}
  .nav-knopf:active:not(:disabled){transform:scale(.95);}
  .zaehler{text-align:center;font-weight:bold;color:var(--grau);}

  /* ---------- Quiz ---------- */
  .combo-anzeige{text-align:center;height:30px;margin:4px 0;}
  .combo-anzeige .feuer-combo{display:inline-block;font-weight:bold;color:var(--feuer);
    font-size:1.1rem;animation:comboPop .3s;}
  @keyframes comboPop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
  .quiz-frage{background:var(--karte);border:1px solid #2c4a6e;border-radius:20px;padding:18px;margin:8px 0;
    box-shadow:0 4px 12px rgba(0,0,0,.4);border-top:4px solid var(--feuer);}
  .quiz-frage .nr{font-size:.78rem;color:var(--grau);font-weight:bold;}
  .quiz-frage .thema{font-size:.72rem;color:var(--gold);font-weight:bold;text-transform:uppercase;}
  .quiz-frage .text{font-size:1.15rem;font-weight:bold;margin:6px 0 4px;color:#fff;}
  .antworten{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
  .antwort-knopf{background:#0f2138;border:2px solid #2c4a6e;border-radius:14px;padding:13px;
    font-size:1rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--text);transition:transform .1s;}
  .antwort-knopf:active{transform:scale(.99);}
  .antwort-knopf.richtig{background:#16432a;border-color:var(--gruen);font-weight:bold;color:#bdf3cd;}
  .antwort-knopf.falsch{background:#43201d;border-color:var(--rot);color:#ffc9c4;}
  .antwort-knopf:disabled{cursor:default;}
  .rueckmeldung{margin-top:12px;padding:13px;border-radius:14px;font-size:.96rem;display:none;}
  .rueckmeldung.zeigen{display:block;}
  .rueckmeldung.gut{background:#16432a;border-left:5px solid var(--gruen);}
  .rueckmeldung.schlecht{background:#43201d;border-left:5px solid var(--rot);}
  .rueckmeldung b{color:var(--gold-hell);}
  .weiter-knopf{background:var(--gruen);color:#fff;border:none;border-radius:30px;width:100%;padding:14px;
    font-size:1.08rem;font-weight:bold;cursor:pointer;font-family:inherit;margin-top:12px;box-shadow:0 3px 8px rgba(63,174,90,.4);}
  .weiter-knopf:active{transform:scale(.98);}

  /* ---------- Lückentext ---------- */
  .luecke-satz{font-size:1.16rem;line-height:2.1;margin:14px 0;}
  .luecke{display:inline-block;min-width:88px;border-bottom:3px dashed var(--gold);
    text-align:center;font-weight:bold;color:var(--gold-hell);padding:0 6px;}
  .luecke.gefuellt{border-bottom:3px solid var(--gruen);color:var(--gruen);}
  .wort-wolke{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;}
  .wort-chip{background:var(--gold);color:#3a2a00;border:none;border-radius:30px;padding:11px 18px;
    font-size:1rem;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 3px 6px rgba(245,178,18,.4);}
  .wort-chip:active{transform:scale(.95);}
  .wort-chip.benutzt{background:#33455a;color:#7d8a99;box-shadow:none;}

  /* ---------- Zuordnung ---------- */
  .zo-paar{margin-bottom:10px;}
  .zo-begriff{background:var(--blau);color:#fff;border-radius:14px 14px 0 0;padding:11px;font-weight:bold;}
  .zo-optionen{display:flex;flex-wrap:wrap;gap:6px;background:var(--karte);border-radius:0 0 14px 14px;padding:8px;border:1px solid #2c4a6e;border-top:none;}
  .zo-opt{border:2px solid #2c4a6e;background:#0f2138;color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font-family:inherit;font-size:.9rem;}
  .zo-opt.richtig{background:#16432a;border-color:var(--gruen);font-weight:bold;color:#bdf3cd;}
  .zo-opt.falsch{background:#43201d;border-color:var(--rot);color:#ffc9c4;}
  .zo-opt:disabled{cursor:default;opacity:.5;}

  /* ---------- Schmiede / Sammlung ---------- */
  .schmiede-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .klinge-karte{background:var(--karte);border:1px solid #2c4a6e;border-radius:16px;padding:14px 10px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.35);position:relative;overflow:hidden;}
  .klinge-karte.besitz{border-color:var(--gold);box-shadow:0 0 16px rgba(245,178,18,.3);}
  .klinge-karte .kemo{font-size:2.6rem;filter:grayscale(1) brightness(.5);transition:filter .4s;}
  .klinge-karte.besitz .kemo{filter:none;animation:shineBlade 2.5s infinite;}
  @keyframes shineBlade{0%,100%{filter:drop-shadow(0 0 2px var(--gold))}50%{filter:drop-shadow(0 0 12px var(--gold-hell))}}
  .klinge-karte .kname{font-weight:bold;font-size:.92rem;margin-top:4px;}
  .klinge-karte .kpreis{font-size:.8rem;color:var(--gold-hell);margin-top:2px;}
  .schmied-knopf{background:linear-gradient(90deg,var(--feuer),var(--gold));color:#3a2200;border:none;
    border-radius:20px;padding:8px 14px;font-weight:bold;cursor:pointer;font-family:inherit;margin-top:8px;font-size:.85rem;}
  .schmied-knopf:disabled{background:#33455a;color:#7d8a99;cursor:default;}
  .schmied-knopf:active:not(:disabled){transform:scale(.95);}
  .besitz-haken{position:absolute;top:6px;right:8px;color:var(--gold);font-weight:bold;}

  /* ---------- Abzeichen ---------- */
  .abz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .abz{background:var(--karte);border:1px solid #2c4a6e;border-radius:14px;padding:12px;text-align:center;}
  .abz.auf{border-color:var(--gold);box-shadow:0 0 12px rgba(245,178,18,.25);}
  .abz .aemo{font-size:1.9rem;filter:grayscale(1) opacity(.4);}
  .abz.auf .aemo{filter:none;}
  .abz .aname{font-weight:bold;font-size:.85rem;margin-top:3px;}
  .abz .ainfo{font-size:.7rem;color:var(--grau);}

  /* ---------- Ergebnis ---------- */
  .ergebnis{background:var(--karte);border:1px solid #2c4a6e;border-radius:22px;padding:26px 20px;text-align:center;
    margin-top:18px;box-shadow:0 6px 18px rgba(0,0,0,.5);}
  .ergebnis .gross{font-size:3.4rem;animation:hop .6s;}
  .ergebnis .punkte{font-size:1.35rem;font-weight:bold;color:var(--gold-hell);margin:8px 0;}
  .ergebnis .lob{font-size:1.02rem;color:var(--gruen);font-weight:bold;}
  .ergebnis .belohn{font-size:.95rem;color:var(--gold-hell);margin-top:6px;}
  .knopf-reihe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .mini-knopf{background:var(--blau);color:#fff;border:none;border-radius:24px;padding:10px 14px;
    font-family:inherit;font-size:.85rem;font-weight:bold;cursor:pointer;}
  .mini-knopf:active{transform:scale(.96);}

  /* ---------- Wappen ---------- */
  .wappen-svg{display:block;margin:10px auto;width:200px;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));}
  .wappen-teil{cursor:pointer;transition:opacity .2s,transform .2s;}
  .wappen-teil:active{transform:scale(.97);}
  .wappen-info{background:var(--karte);border:1px solid #2c4a6e;border-radius:18px;padding:16px;margin-top:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.35);border-left:5px solid var(--gold);min-height:80px;}
  .wappen-info b{color:var(--gold-hell);display:block;margin-bottom:4px;font-size:1.06rem;}
  .tipp-zeile{font-size:.84rem;color:var(--grau);text-align:center;margin-top:8px;}

  /* ---------- Wissens-Block ---------- */
  .info-block{background:var(--karte);border:1px solid #2c4a6e;border-radius:18px;padding:16px 18px;margin:12px 0;
    box-shadow:0 4px 12px rgba(0,0,0,.3);border-top:4px solid var(--gold);}
  .info-block h3{margin:0 0 8px;color:var(--gold-hell);font-size:1.08rem;}
  .info-block ul{margin:6px 0;padding-left:20px;}
  .info-block li{margin:5px 0;}
  .info-block b{color:#fff;}
  .info-block .merk{background:#2a1c00;border-radius:10px;padding:8px 10px;font-size:.9rem;margin-top:8px;}
  .pill{display:inline-block;background:var(--gold-hell);color:#3a2a00;border-radius:20px;padding:2px 10px;font-size:.8rem;font-weight:bold;margin:2px;}

  /* ---------- Effekte ---------- */
  .funke{position:fixed;z-index:50;pointer-events:none;font-size:1rem;will-change:transform;}
  .floattext{position:fixed;z-index:51;pointer-events:none;font-weight:bold;font-size:1.2rem;
    text-shadow:0 1px 4px #000;animation:floatUp 1s ease-out forwards;}
  @keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}
  .shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* Level-Up Overlay */
  .overlay{position:fixed;inset:0;z-index:200;background:rgba(6,14,24,.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .overlay .strahl{font-size:5rem;animation:levelGlow 1.2s infinite;}
  @keyframes levelGlow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 16px var(--gold))}50%{transform:scale(1.15);filter:drop-shadow(0 0 30px var(--gold-hell))}}
  .overlay h2{font-size:1.8rem;color:var(--gold-hell);margin:14px 0 4px;}
  .overlay p{color:var(--text);font-size:1.05rem;margin:2px 0;}
  .overlay .neu-rang{font-size:1.5rem;font-weight:bold;color:#fff;margin-top:8px;}
  .overlay button{margin-top:22px;background:linear-gradient(90deg,var(--feuer),var(--gold));color:#3a2200;
    border:none;border-radius:30px;padding:14px 28px;font-size:1.15rem;font-weight:bold;cursor:pointer;font-family:inherit;}

  .fuss{text-align:center;font-size:.76rem;color:var(--grau);margin-top:22px;}
  .verstecken{display:none;}
</style>
</head>
<body>
<div class="embers" id="embers"></div>

<div class="wrap">
  <!-- HUD -->
  <div class="hud">
    <div class="hud-top">
      <span class="avatar" id="hud-avatar">🧒</span>
      <div class="rang-info">
        <div class="rang-name" id="hud-rang">Lehrling</div>
        <div class="rang-sub" id="hud-sub">Level 1</div>
      </div>
      <button class="ton-knopf" id="ton-knopf" onclick="tonUmschalten()" title="Ton an/aus">🔊</button>
      <span class="taler">🪙 <span id="hud-taler">0</span></span>
    </div>
    <div class="xp-leiste"><div class="xp-fuell" id="xp-fuell"></div><div class="xp-text" id="xp-text"></div></div>
  </div>

  <div id="ansicht"></div>

  <div class="fuss">Solinger Klingenschmiede · Sachunterricht Klasse 3 · Schmiede dein Wissen! 🔥</div>
</div>

<script>
/* =========================================================
   LERNINHALTE (aus dem Solingen-Heft + ergänzte Prüfungsfragen)
   ========================================================= */
const THEMEN=[
  {id:"geschichte",emo:"🏰",titel:"Geschichte",mini:"Wie Solingen entstand"},
  {id:"wappen",emo:"🛡️",titel:"Das Wappen",mini:"Anker & Schwerter"},
  {id:"staedte",emo:"🗺️",titel:"Die 5 Städte",mini:"Stadtteile"},
  {id:"berufe",emo:"🔨",titel:"Berufe & Klingen",mini:"Schmied & Co."},
  {id:"wasser",emo:"💧",titel:"Bäche & Kotten",mini:"Wasserkraft & Sage"},
  {id:"haeuser",emo:"🏚️",titel:"Fachwerk & Feuer",mini:"Häuser & Tore"},
];
const KARTEN={
  geschichte:[
    {f:"Wie hieß die Gegend von Solingen bei den ersten Siedlern?",a:"„Solonchon“",t:"Daraus wurde später Solingen."},
    {f:"Wie veränderte sich der Name?",a:"Solonchon → Solagon → Solonchon → Solungen → Solingen",t:"Über viele Jahre."},
    {f:"Wann wurde Solingen zum ersten Mal erwähnt?",a:"Ungefähr im Jahr 1000",t:"Über 1000 Jahre her!"},
    {f:"An welchem Tag bekam Solingen die Stadtrechte?",a:"Am 23. Februar 1374",t:"Merke: 1374 = Stadt."},
    {f:"Wie alt wurde Solingen im Jahr 1974?",a:"600 Jahre alt",t:"1374 + 600 = 1974."},
    {f:"Wer verlieh Solingen die Stadtrechte?",a:"Der Graf und die Gräfin von Berg",t:"Darum: „Bergisches Land“."},
    {f:"Was durften die Bürger ab 1374? (1)",a:"Einen Bürgermeister wählen",t:""},
    {f:"Was durften die Bürger ab 1374? (2)",a:"Die Stadt mit Mauern und Toren befestigen",t:""},
    {f:"Was durften die Bürger ab 1374? (3)",a:"Selbst Gericht abhalten",t:""},
    {f:"Was durften die Bürger ab 1374? (4)",a:"Einen Wochenmarkt und Jahrmarkt abhalten",t:""},
  ],
  wappen:[
    {f:"Was zeigt das Solinger Wappen?",a:"Goldener Anker + zwei gekreuzte Schwerter auf blauem Grund",t:""},
    {f:"Wofür stehen die zwei Schwerter?",a:"Für die Solinger Industrie – das Schmieden von Klingen",t:""},

/* =========================================================

   ========================================================= */
function hudUpdate(animBar){
  const ri=rangIndex();const rang=RAENGE[ri];
  $("#hud-avatar").textContent=rang.emo;
  $("#hud-rang").textContent=rang.name;
  $("#hud-sub").textContent="Level "+(ri+1);
  $("#hud-taler").textContent=S.taler;
  $("#ton-knopf").textContent=S.sound?"🔊":"🔇";
  const naechste=RAENGE[ri+1];
  const fuell=$("#xp-fuell");const txt=$("#xp-text");
  if(naechste){
    const span=naechste.xp-rang.xp;const fort=S.xp-rang.xp;
    const proz=Math.max(0,Math.min(100,Math.round(fort/span*100)));
    fuell.style.width=proz+"%";
    txt.textContent=S.xp+" / "+naechste.xp+" Funken";
  }else{fuell.style.width="100%";txt.textContent="MAX – "+S.xp+" Funken 👑";}
}

/* =========================================================
   TON (WebAudio)
   ========================================================= */
let actx=null;
function beep(freq,dur,type,vol){
  if(!S.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||"square";o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(vol||0.05,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
    o.start();o.stop(actx.currentTime+dur);}catch(e){}
}
function tonRichtig(){beep(660,0.08,"square");setTimeout(()=>beep(990,0.12,"square"),90);}
function tonFalsch(){beep(160,0.25,"sawtooth",0.06);}
function tonMuenze(){beep(1320,0.07,"triangle",0.05);}
function tonLevel(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"square"),i*120));}
function tonSchmied(){beep(220,0.05,"square",0.07);setTimeout(()=>beep(180,0.12,"sawtooth",0.06),70);}
function tonUmschalten(){S.sound=!S.sound;save();hudUpdate();if(S.sound)tonMuenze();}

/* =========================================================
   EFFEKTE
   ========================================================= */
function spark(x,y,farben){
  farben=farben||["⭐","✨","🔥","💫"];
  for(let i=0;i<10;i++){
    const f=document.createElement("div");
    f.className="funke";f.textContent=farben[Math.floor(Math.random()*farben.length)];
    f.style.left=x+"px";f.style.top=y+"px";
    document.body.appendChild(f);
    const ang=Math.random()*Math.PI*2,dist=40+Math.random()*70;
    const dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist-30;
    f.animate([{transform:"translate(0,0) scale(1)",opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:0}],
      {duration:700+Math.random()*300,easing:"ease-out"});
    setTimeout(()=>f.remove(),1000);
  }
}
function floatText(x,y,text,farbe){
  const t=document.createElement("div");
  t.className="floattext";t.textContent=text;t.style.color=farbe||"#ffd65a";
  t.style.left=x+"px";t.style.top=y+"px";
  document.body.appendChild(t);setTimeout(()=>t.remove(),1000);
}
function mittelpunkt(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function avatarHop(){const a=$("#hud-avatar");a.classList.remove("hop");void a.offsetWidth;a.classList.add("hop");}

/* =========================================================
   BELOHNUNG + LEVEL-UP + ABZEICHEN
   ========================================================= */
function belohnung(funken,taler,el){
  const ri0=rangIndex();
  S.xp+=funken;S.taler+=taler;
  save();
  if(el){const p=mittelpunkt(el);
    spark(p.x,p.y);
    floatText(p.x-10,p.y-20,"+"+funken+" 🔥","#ff9a3c");
    if(taler)floatText(p.x+30,p.y-10,"+"+taler+" 🪙","#ffd65a");
  }
  tonMuenze();
  hudUpdate(true);avatarHop();
  const ri1=rangIndex();
  pruefeAbzeichen();
  if(ri1>ri0)levelUp(ri1);
}
function levelUp(ri){
  const rang=RAENGE[ri];
  tonLevel();
  for(let i=0;i<3;i++)setTimeout(()=>spark(window.innerWidth/2,window.innerHeight/2,["⚔️","🏆","⭐","🔥","👑"]),i*200);
  const ov=document.createElement("div");
  ov.className="overlay";
  ov.innerHTML=`<div class="strahl">${rang.emo}</div>
    <h2>Aufgestiegen!</h2>
    <p>Du bist jetzt</p>
    <div class="neu-rang">${rang.name} (Level ${ri+1})</div>
    <button onclick="this.parentElement.remove()">Weiter schmieden 🔨</button>`;
  document.body.appendChild(ov);
  if(rang.name==="Schmied")vergebeAbzeichen("schmied");
  if(rang.name==="Klingenmeister")vergebeAbzeichen("meister");
}
function vergebeAbzeichen(id){
  if(S.badges.includes(id))return;
  S.badges.push(id);save();
  const ab=ABZEICHEN.find(a=>a.id===id);
  const t=document.createElement("div");
  t.className="floattext";t.textContent="🏅 Abzeichen: "+ab.name+"!";
  t.style.left=(window.innerWidth/2-110)+"px";t.style.top=(window.innerHeight-140)+"px";
  t.style.fontSize="1.05rem";t.style.color="#ffd65a";
  t.style.animationDuration="2s";
  document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
  beep(880,0.15,"triangle");
}
function pruefeAbzeichen(){
  if(S.correct>=1)vergebeAbzeichen("funke");
  if(S.bestCombo>=5)vergebeAbzeichen("combo5");
  if(S.bestCombo>=10)vergebeAbzeichen("combo10");
  if(S.correct>=25)vergebeAbzeichen("c25");
  if(S.correct>=100)vergebeAbzeichen("c100");
  if(S.wappen.length>=4)vergebeAbzeichen("wappen");
  if(S.blades.length>=KLINGEN.length)vergebeAbzeichen("sammler");
  if((S.daily.count||0)>=3)vergebeAbzeichen("daily3");
}

function konfettiGross(){
  const x=window.innerWidth/2,y=window.innerHeight/3;
  for(let i=0;i<4;i++)setTimeout(()=>spark(x+(Math.random()*200-100),y,["🎉","⭐","⚔️","🏆","✨","🔥"]),i*150);
}
function mischen(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* =========================================================
   QUIZ (mit Combo)
   ========================================================= */
let quizListe=[],quizIdx=0,quizRichtig=0,quizThemaId="alle",combo=0,istTages=false;
const THEMA_MAP={geschichte:"Geschichte",wappen:"Wappen",staedte:"Die 5 Städte",berufe:"Berufe",wasser:"Wasser",haeuser:"Fachwerk & Feuer"};
function modusQuiz(id){
  istTages=false;quizThemaId=id;combo=0;
  let pool=id==="alle"?QUIZ.slice():QUIZ.filter(q=>q.thema===THEMA_MAP[id]);
  quizListe=mischen(pool);if(id==="alle")quizListe=quizListe.slice(0,15);
  quizIdx=0;quizRichtig=0;zeigeQuiz();
}
function tagesAufgabe(){
  istTages=true;quizThemaId="alle";combo=0;
  quizListe=mischen(QUIZ).slice(0,5);quizIdx=0;quizRichtig=0;zeigeQuiz();
}
function zeigeQuiz(){
  const q=quizListe[quizIdx];
  const opts=mischen(q.o.map((text,i)=>({text,korrekt:i===q.r})));
  const comboHtml=combo>=2?`<span class="feuer-combo">🔥 Combo x${combo}!</span>`:"";
  let h=`<button class="zurueck" onclick="${istTages?'startseite()':(quizThemaId==='alle'?'startseite()':"themenseite('"+quizThemaId+"')")}">⬅️ Zurück</button>
    <h2>${istTages?'📅 Tagesaufgabe':'❓ Quiz'}</h2>
    <div class="combo-anzeige">${comboHtml}</div>
    <div class="quiz-frage">
      <div class="nr">Frage ${quizIdx+1}/${quizListe.length} · ⭐ ${quizRichtig} richtig</div>
      <div class="thema">${q.thema}</div><div class="text">${q.f}</div>
      <div class="antworten">`;
  opts.forEach(o=>{h+=`<button class="antwort-knopf" data-k="${o.korrekt}" onclick="antwortKlick(this,event)">${o.text}</button>`;});
  h+=`</div><div class="rueckmeldung" id="rueck"></div></div>`;
  ansicht.innerHTML=h;window.scrollTo(0,0);
}
function antwortKlick(btn,ev){
  const korrekt=btn.dataset.k==="true";
  const alle=ansicht.querySelectorAll(".antwort-knopf");
  alle.forEach(b=>{b.disabled=true;if(b.dataset.k==="true")b.classList.add("richtig");});
  const rueck=$("#rueck");
  S.answered++;
  if(korrekt){
    btn.classList.add("richtig");quizRichtig++;combo++;S.correct++;
    if(combo>S.bestCombo)S.bestCombo=combo;
    const bonus=Math.min(combo-1,5)*3;  // Combo-Bonus
    const funken=10+bonus;const taler=5+(combo>=3?2:0);
    tonRichtig();
    belohnung(funken,taler,btn);
    rueck.className="rueckmeldung gut zeigen";
    rueck.innerHTML=`✅ <b>Richtig!</b> +${funken} Funken 🔥`+(bonus?` <b>(+${bonus} Combo-Bonus!)</b>`:``)+` · +${taler} Taler 🪙`;
  }else{
    btn.classList.add("falsch");combo=0;
    tonFalsch();
    ansicht.querySelector("h2").classList.add("shake");
    const richtigeAntwort=[...alle].find(b=>b.dataset.k==="true").textContent;
    rueck.className="rueckmeldung schlecht zeigen";
    rueck.innerHTML=`❌ Nicht ganz. Richtig ist: <b>${richtigeAntwort}</b><br><span style="font-size:.85rem">Combo verloren – neuer Anlauf!</span>`;
  }
  const letzte=quizIdx===quizListe.length-1;
  rueck.innerHTML+=`<button class="weiter-knopf" onclick="quizWeiter()">${letzte?"Ergebnis 🏁":"Weiter ➡️"}</button>`;
  save();
}
function quizWeiter(){if(quizIdx<quizListe.length-1){quizIdx++;zeigeQuiz();}else quizErgebnis();}
function quizErgebnis(){
  const gesamt=quizListe.length;const quote=quizRichtig/gesamt;
  let emo="💪",lob="Weiter üben – du schaffst das!",bonus=0;
  if(quote===1){emo="🏆";lob="Perfekt! Alles richtig!";bonus=30;konfettiGross();}
  else if(quote>=0.7){emo="🌟";lob="Sehr gut gemacht!";bonus=15;konfettiGross();}
  else if(quote>=0.5){emo="👍";lob="Gut! Schau die Themen nochmal an.";bonus=5;}
  if(istTages){
    bonus+=20;S.daily.done=true;S.daily.count=(S.daily.count||0)+1;
  }
  S.xp+=bonus;if(bonus)S.taler+=Math.round(bonus/2);
  save();hudUpdate(true);pruefeAbzeichen();
  ansicht.innerHTML=`<div class="ergebnis"><div class="gross">${emo}</div>
    <div class="punkte">${quizRichtig} von ${gesamt} richtig</div>
    <div class="lob">${lob}</div>
    <div class="belohn">${istTages?'📅 Tagesaufgabe geschafft! ':''}Bonus: +${bonus} Funken 🔥${bonus?` · +${Math.round(bonus/2)} Taler 🪙`:''}</div>
    <div class="knopf-reihe">
      ${istTages?'':`<button class="mini-knopf" onclick="modusQuiz('${quizThemaId}')">🔁 Nochmal</button>`}
      <button class="mini-knopf" onclick="zeigeSchmiede()">⚒️ Schmiede</button>
      <button class="mini-knopf" onclick="startseite()">🏠 Start</button></div></div>`;
  window.scrollTo(0,0);
}

/* =========================================================
   LÜCKENTEXT
   ========================================================= */
let lueckeIdx=0,lueckeOffen=0;
function zeigeLuecken(){lueckeIdx=0;startLuecke();}
function startLuecke(){
  const akt=LUECKEN[lueckeIdx];let satzHtml="",nr=0;
  akt.teile.forEach((teil,i)=>{
    if(i%2===1){satzHtml+=`<span class="luecke" data-loesung="${teil}"></span>`;nr++;}
    else satzHtml+=teil;
  });
  lueckeOffen=nr;
  let chips="";mischen(akt.woerter).forEach(w=>{chips+=`<button class="wort-chip" data-wort="${w}" onclick="wortGesetzt(this,event)">${w}</button>`;});
  ansicht.innerHTML=`<button class="zurueck" onclick="startseite()">⬅️ Zurück</button>
    <h2>✏️ Lückentext</h2><div class="zaehler">Satz ${lueckeIdx+1} von ${LUECKEN.length}</div>
    <div class="quiz-frage"><div class="luecke-satz">${satzHtml}</div></div>
    <p style="text-align:center;color:var(--grau);font-size:.9rem">Tippe das passende Wort 👇</p>
    <div class="wort-wolke">${chips}</div><div class="rueckmeldung" id="rueckL"></div>`;
  window.scrollTo(0,0);
}
function wortGesetzt(btn,ev){
  const wort=btn.dataset.wort;
  const luecken=[...ansicht.querySelectorAll(".luecke")];
  let ziel=luecken.find(l=>!l.classList.contains("gefuellt")&&l.dataset.loesung===wort)
        || luecken.find(l=>!l.classList.contains("gefuellt"));
  if(!ziel)return;
  const richtig=ziel.dataset.loesung===wort;
  ziel.textContent=wort;ziel.classList.add("gefuellt");
  if(!richtig){ziel.style.borderBottomColor="var(--rot)";ziel.style.color="var(--rot)";tonFalsch();}
  else tonMuenze();
  btn.classList.add("benutzt");btn.disabled=true;lueckeOffen--;
  if(lueckeOffen<=0)lueckeAuswerten(btn);
}
function lueckeAuswerten(letzterBtn){
  const luecken=[...ansicht.querySelectorAll(".luecke")];
  const allesRichtig=luecken.every(l=>l.dataset.loesung===l.textContent);
  const rueck=$("#rueckL");const letzte=lueckeIdx===LUECKEN.length-1;
  if(allesRichtig){S.correct++;S.answered++;belohnung(12,4,letzterBtn);
    rueck.className="rueckmeldung gut zeigen";rueck.innerHTML=`✅ <b>Alles richtig!</b> +12 Funken 🔥 · +4 Taler 🪙`;}
  else{S.answered++;save();tonFalsch();
    rueck.className="rueckmeldung schlecht zeigen";
    rueck.innerHTML=`Fast! Die Lösung war: <b>${luecken.map(l=>l.dataset.loesung).join(" … ")}</b>`;}
  rueck.innerHTML+=`<button class="weiter-knopf" onclick="lueckeWeiter()">${letzte?"Fertig 🏁":"Nächster Satz ➡️"}</button>`;
}
function lueckeWeiter(){
  if(lueckeIdx<LUECKEN.length-1){lueckeIdx++;startLuecke();}
  else{konfettiGross();
    ansicht.innerHTML=`<div class="ergebnis"><div class="gross">🏆</div><div class="punkte">Lückentext geschafft!</div>
      <div class="lob">Toll gemacht!</div>
      <div class="knopf-reihe"><button class="mini-knopf" onclick="zeigeLuecken()">🔁 Nochmal</button>
      <button class="mini-knopf" onclick="startseite()">🏠 Start</button></div></div>`;}
}

let zoIdx=0,zoGeloest=0;

function zoKlick(btn,ev){

  if(richtig){btn.classList.add("richtig");geschwister.forEach(b=>b.disabled=true);

function zoFertig(){

}
function zoWeiter(){
  if(zoIdx<ZUORDNUNGEN.length-1){zoIdx++;startZuordnung();}
  else{konfettiGross();
    ansicht.innerHTML=`<div class="ergebnis"><div class="gross">🏆</div><div class="punkte">Alles richtig zugeordnet!</div>
      <div class="lob">Klasse!</div>

/* =========================================================
   SCHMIEDE (Klingen kaufen/sammeln)
   ========================================================= */
function zeigeSchmiede(){
  let h=`<button class="zurueck" onclick="startseite()">⬅️ Zurück</button>
    <h2>⚒️ Deine Schmiede</h2>
    <p style="text-align:center;color:var(--grau);font-size:.92rem">Sammle <b style="color:var(--gold-hell)">🪙 Taler</b> beim Lernen und schmiede dir Klingen! (${S.blades.length}/${KLINGEN.length})</p>
    <div class="schmiede-grid">`;
  KLINGEN.forEach(k=>{
    const hat=S.blades.includes(k.id);const kannZahlen=S.taler>=k.preis;
    h+=`<div class="klinge-karte ${hat?'besitz':''}">
      ${hat?'<span class="besitz-haken">✓</span>':''}
      <div class="kemo">${k.emo}</div>
      <div class="kname">${k.name}</div>`;
    if(hat)h+=`<div class="kpreis">✅ Geschmiedet</div>`;
    else h+=`<div class="kpreis">🪙 ${k.preis}</div>
      <button class="schmied-knopf" onclick="schmiede('${k.id}',this,event)" ${kannZahlen?'':'disabled'}>${kannZahlen?'🔨 Schmieden':'zu teuer'}</button>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  ansicht.innerHTML=h;window.scrollTo(0,0);
}
function schmiede(id,btn,ev){
  const k=KLINGEN.find(x=>x.id===id);
  if(S.taler<k.preis||S.blades.includes(id))return;
  S.taler-=k.preis;S.blades.push(id);save();
  tonSchmied();
  const p=mittelpunkt(btn);
  spark(p.x,p.y,["🔨","✨","🔥","⭐"]);
  floatText(p.x,p.y-20,k.emo+" geschmiedet!","#ffd65a");
  hudUpdate();pruefeAbzeichen();
  // Hammer-Animation: kurzer Screen-Hint
  setTimeout(()=>zeigeSchmiede(),350);
}

/* =========================================================

function zeigeAbzeichen(){
  let h=`<button class="zurueck" onclick="startseite()">⬅️ Zurück</button>
    <h2>🏅 Deine Abzeichen (${S.badges.length}/${ABZEICHEN.length})</h2>
    <div class="abz-grid">`;
  ABZEICHEN.forEach(a=>{const auf=S.badges.includes(a.id);
    h+=`<div class="abz ${auf?'auf':''}"><div class="aemo">${auf?a.emo:'🔒'}</div>
      <div class="aname">${a.name}</div><div class="ainfo">${a.info}</div></div>`;});
  h+=`</div>`;
  ansicht.innerHTML=h;window.scrollTo(0,0);
}

function wappenKlick(teil,ev){
